<!DOCTYPE html>

	<title>HTML Formatting Tags</title>
</head>
<body>
	<h1>HTML Formatting Tags</h1>
	<p><b>Bold Text</b></p>
	<p><strong>Strong Text</s><p>
	<p><i>Italic Text</i></p>
	<p><em>Emphasized Text</em></p>
	<p><u>Underlined Text</u></p>
	<p><mark>Highlighted Text</mark></p>
	<p><small>Small Text</small></p>
	<p>This is<del>Delected</del>Text.</p>
	<p>This is <ins>Inserted</ins></p>
	<p>Water formula: H<sub>2</sub>0</p>
<p>Math Formula: x<sup>2</sup> + y<sup>2</sup></p>
</body>
